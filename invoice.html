        (function () {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || !theme) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

        }

        #invoiceArea.invoice-dark-mode .ornament-2 {
            background: linear-gradient(to right, rgba(99, 102, 241, 0.22), rgba(236, 72, 153, 0.06)) !important;
        }

        /* Drag and Drop Item Sorting Styles */
        .invoice-row {
            transition: background-color 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
        }

        .drag-handle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            padding: 2px 3px;
            border-radius: 4px;
            transition: color 0.15s ease, background-color 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .drag-handle:hover {
            color: #4f46e5 !important;
            background-color: rgba(99, 102, 241, 0.12);
        }

        .invoice-row.dragging {
            opacity: 0.35 !important;
            background-color: rgba(99, 102, 241, 0.12) !important;
        }

        .invoice-row.drag-over-top {
            box-shadow: inset 0 3px 0 0 #4f46e5 !important;
        }

        .invoice-row.drag-over-bottom {
            box-shadow: inset 0 -3px 0 0 #4f46e5 !important;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            html, body {
                width: 210mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: transparent !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            body:not(.print-dark-mode) {
                background: #ffffff !important;
            }
            body.print-dark-mode {
                background: #121215 !important;
            }
            .no-print, .no-print *, .drag-handle {
                display: none !important;
                visibility: hidden !important;
            }
            .max-w-5xl {
                max-width: 210mm !important;
                width: 210mm !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            #invoiceArea {
                border: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                margin: 0 !important;
                width: 210mm !important;
                min-height: auto !important;
                max-height: none !important;
                padding: 8mm 12mm !important;
                box-sizing: border-box !important;
                page-break-after: auto !important;

            }
            #invoiceArea.invoice-dark-mode {
                background-color: #121215 !important;
                color: #f4f4f5 !important;
            }
        }
    </style>
