<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice - FPManager</title>
    <!-- meta infoemasi -->
    <meta name="title" content="FPM - Freelance Project Manager - by Alwan">
    <meta name="description"
        content="FPManager adalah aplikasi manajemen projek freelance untuk membantu mengelola pelanggan, projek, invoice, pembayaran, deadline, dan laporan keuangan secara mudah dan efisien.">
    <meta name="keywords"
        content=" Freelance, Project Manager, Invoice, Keuangan, Manajemen Proyek, Pelanggan, Dashboard, Web App, JavaScript">
    <meta name="author" content="Alwan">
    <meta name="robots" content="index, follow">
    <meta name="language" content="Indonesian">
    <meta name="theme-color" content="#2563EB">
    <meta name="application-name" content="FPManager">

    <!-- Mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FPManager">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="FPM - Freelance Project Manager - by Alwan">
    <meta property="og:description"
        content="FPM adalah aplikasi manajemen projek freelance untuk membantu mengelola pelanggan, projek, invoice, pembayaran, deadline, dan laporan keuangan secara mudah dan efisien.">
    <meta property="og:locale" content="id_ID">
    <meta property="og:site_name" content="FPManager">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="apple-touch-icon" href="assets/img/favicon.png">
    <!-- Tailwind -->
    <link href="css/tailwind.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Global Style -->

    <link rel="stylesheet" href="css/darkmode.css">

    <style>
        #invoiceArea {
            position: relative;
            overflow: hidden;
        }

        .invoice-row:nth-child(even) {
            background-color: #f9fafb;
        }

        .nominal-cell {
            background-color: #f8fafc !important;
            border-left: 2px solid #e4e4e7 !important;
        }

        .invoice-row td {
            padding-top: 4px !important;
            padding-bottom: 4px !important;
        }

        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print, .no-print * {
                display: none !important;
            }
            .max-w-5xl {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            #invoiceArea {
                border: none !important;
                box-shadow: none !important;
                padding: 10mm !important;
                margin: 0 !important;
                width: 100% !important;
                max-height: 297mm !important;
                page-break-inside: avoid !important;
                overflow: hidden !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>

    <link rel="manifest" href="manifest.json">


<body class="bg-zinc-100">
    <div class="max-w-5xl mx-auto py-4 px-2 md:py-10 md:px-6">

        <!-- Header -->
        <div class="no-print flex justify-between items-center mb-6">
            <button onclick="history.back()"
                class="no-print bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl shadow-md transition-all flex items-center">
                <i class="fa fa-arrow-left mr-2"></i>
                Kembali
            </button>
        </div>

        <!-- Control Panel (Document Settings) -->
        <div
            class="no-print bg-white rounded-xl shadow-md border border-zinc-200 p-4 mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <span class="font-semibold text-zinc-700">Tipe Dokumen:</span>
                <div class="flex bg-zinc-100 p-1 rounded-xl w-full sm:w-auto">
                    <button id="btnTypeInvoice"
                        class="flex-1 sm:flex-initial px-4 py-2 rounded-lg font-semibold transition-all text-sm bg-indigo-600 text-white shadow-sm">
                        Invoice
                    </button>
                    <button id="btnTypeNota"
                        class="flex-1 sm:flex-initial px-4 py-2 rounded-lg font-semibold transition-all text-sm text-zinc-600 hover:text-zinc-900">
                        Nota
                    </button>
                </div>
            </div>
            <div class="flex items-center gap-2 self-start sm:self-auto">
                <label class="relative flex items-center cursor-pointer select-none">
                    <input type="checkbox" id="chkShowSignature" class="sr-only peer" checked>
                    <div
                        class="w-11 h-6 bg-zinc-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600">
                    </div>
                    <span class="ml-3 font-semibold text-zinc-700 text-sm">Tampilkan Tanda Tangan</span>
                </label>
            </div>
        </div>

        <!-- Invoice -->

        <div id="invoiceArea"
            class="bg-white rounded-xl shadow-xl border border-zinc-200 p-4 sm:p-6 md:p-10 relative overflow-hidden text-xs md:text-base">

            <!-- Top Accent Gradient Line -->
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-600 to-purple-600 z-20"></div>

            <!-- Watermark Background (HTML Image Grid for absolute compatibility and customizable spacing) -->
            <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden" id="watermarkGrid" style="-webkit-print-color-adjust: exact; print-color-adjust: exact;"></div>

            <!-- Background Decorative Ornaments (Slanted modern polygon blocks, no circles) -->
            <div class="absolute top-0 right-0 w-80 h-32 pointer-events-none z-0 overflow-hidden" style="transform: skewX(-30deg) translateX(40px); background: linear-gradient(to left, rgba(79, 70, 229, 0.18), rgba(139, 92, 246, 0.06)); -webkit-print-color-adjust: exact; print-color-adjust: exact;"></div>
            <div class="absolute bottom-0 left-0 w-80 h-32 pointer-events-none z-0 overflow-hidden" style="transform: skewX(-30deg) translateX(-40px); background: linear-gradient(to right, rgba(79, 70, 229, 0.14), rgba(236, 72, 153, 0.04)); -webkit-print-color-adjust: exact; print-color-adjust: exact;"></div>

            <div class="relative z-10 space-y-8">
                <div class="flex justify-between border-b pb-6">

                    <div>

                        <h2 id="previewDocTitle" class="text-2xl md:text-4xl font-bold text-indigo-600">

                            INVOICE

                        </h2>

                        <p class="mt-2 md:mt-4">

                            <b id="previewDocNoLabel">No Invoice :</b>

                            <span id="previewInvoiceNo">-</span>

                        </p>

                        <p>

                            <b data-i18n="inv-date">Tanggal :</b>

                            <span id="previewTanggal">-</span>

                        </p>

                    </div>

                    <div class="text-right flex flex-col items-end">

                        <img src="./assets/img/logo.png" alt="FPManager Logo"
                            class="h-8 md:h-10 w-auto mb-1 md:mb-2 object-contain">

                        <p class="text-zinc-500 text-[10px] md:text-sm">

                            Indonesia

                        </p>

                    </div>

                </div>

                <!-- Customer -->

                <div class="grid grid-cols-2 gap-2 md:gap-6 mt-4 md:mt-8">

                    <div>

                        <h3 class="font-bold text-sm md:text-lg mb-1 md:mb-2" data-i18n="inv-to">

                            Kepada

                        </h3>

                        <p id="previewPelanggan"></p>

                        <p id="previewWA"></p>

                    </div>

                    <div class="text-right">
                        <!-- Status and Deadline removed as requested -->
                    </div>

                </div>

                <!-- Table -->

                <table class="w-full mt-4 md:mt-8 border text-[10px] md:text-base">

                    <thead class="bg-indigo-600 text-white">

                        <tr>
                            <th class="p-1 md:p-3 w-8 md:w-12 text-center">No</th>
                            <th class="p-1 md:p-3" data-i18n="inv-product">

                                Nama Produk

                            </th>

                            <th data-i18n="inv-qty">

                                Qty

                            </th>

                            <th data-i18n="inv-price">

                                Harga

                            </th>

                            <th data-i18n="inv-total">

                                Total

                            </th>

                        </tr>

                    </thead>

                    <tbody id="invoiceTableBody">
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">1</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true" id="previewProduk"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"
                                id="previewJumlah"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"
                                id="previewHarga"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"
                                id="previewNominal"></td>
                        </tr>
                        <!-- Baris kosong tambahan (menjadi 15 baris total) -->
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">2</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"></td>
                        </tr>
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">3</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"></td>
                        </tr>
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">4</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"></td>
                        </tr>
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">5</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"></td>
                        </tr>
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">6</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"></td>
                        </tr>
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">7</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"></td>
                        </tr>
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">8</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"></td>
                        </tr>
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">9</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"></td>
                        </tr>
                        <tr class="invoice-row">
                            <td class="border p-1 md:p-3 text-center">10</td>
                            <td class="border p-1 md:p-3 editable-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell qty-cell" contenteditable="true"></td>
                            <td class="border text-center editable-cell price-cell" contenteditable="true"></td>
                            <td class="border text-center font-bold nominal-cell" contenteditable="true"></td>
                        </tr>

                    </tbody>

                </table>

                <!-- Total -->
                <div class="flex justify-end mt-8" style="page-break-inside: avoid;">
                    <div class="w-80 bg-zinc-50 rounded-xl border border-zinc-200 p-4 space-y-3">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-zinc-500 font-semibold" data-i18n="inv-total">Total</span>
                            <span class="font-bold text-zinc-900 text-base outline-none" contenteditable="true"
                                id="previewTotal"></span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-zinc-500 font-semibold" data-i18n="inv-dp">DP</span>
                            <span class="font-semibold text-zinc-800 outline-none" contenteditable="true"
                                id="previewDP"></span>
                        </div>
                        <div class="border-t border-zinc-200 my-2 pt-2 flex justify-between items-center text-sm">
                            <span class="text-zinc-900 font-bold" data-i18n="inv-balance">Sisa Pembayaran</span>
                            <span class="text-red-600 font-extrabold text-base outline-none" contenteditable="true"
                                id="previewSisa"></span>
                        </div>
                    </div>

                </div>

                <!-- Bottom Section: Catatan & Tanda Tangan -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-8" style="page-break-inside: avoid;">
                    <!-- Catatan -->
                    <div>
                        <h3 class="font-bold mb-2 text-zinc-700" data-i18n="inv-notes">
                            Catatan
                        </h3>
                        <div class="bg-zinc-100 rounded-lg p-4 min-h-[100px]">
                            <span id="previewCatatan" class="outline-none block w-full h-full" contenteditable="true">
                                -
                            </span>
                        </div>
                    </div>

                    <!-- Tanda Tangan -->
                    <div id="signatureSection" class="flex flex-col items-end justify-end mt-6 md:mt-0">
                        <div class="w-60 text-center flex flex-col items-center ml-auto">
                            <p id="previewSignTitle" class="font-medium text-zinc-600 outline-none"
                                contenteditable="true">
                                Hormat Kami,
                            </p>
                            <div class="h-16 my-2 flex items-center justify-center">
                                <img id="previewSignImage" src="assets/img/ttd.png" alt="Tanda Tangan"
                                    class="h-16 w-auto object-contain">
                            </div>
                            <div class="border-b border-zinc-400 w-full mb-2"></div>
                            <p id="previewSignName" class="font-bold text-zinc-800 outline-none" contenteditable="true">
                                @premium_dz
                            </p>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Action -->

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 mt-8 no-print ">

            <button id="btnSaveInvoice"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-4 rounded-lg font-semibold flex items-center justify-center">
                <i class="fa fa-save mr-2"></i>
                <span>Simpan Perubahan</span>
            </button>
            <button id="btnResetInvoice"
                class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-4 rounded-lg font-semibold flex items-center justify-center">
                <i class="fa fa-undo mr-2"></i>
                <span>Reset</span>
            </button>
            <button id="btnPDF"
                class="bg-red-600 hover:bg-red-700 text-white px-6 py-4 rounded-lg font-semibold flex items-center justify-center">

                <i class="fa fa-file-pdf mr-2"></i>

                <span data-i18n="inv-btn-pdf">Download PDF</span>

            </button>

            <button onclick="window.print()"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-4 rounded-lg font-semibold flex items-center justify-center">

                <i class="fa fa-print mr-2"></i>

                <span data-i18n="inv-btn-print">Print</span>

            </button>

            <button onclick="history.back()"
                class="bg-zinc-700 hover:bg-zinc-800 text-white px-6 py-4 rounded-lg font-semibold flex items-center justify-center">

                <i class="fa fa-arrow-left mr-2"></i>

                <span data-i18n="inv-btn-back">Kembali</span>

            </button>

        </div>

    </div>

    <!-- Library PDF -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Global JS -->
    <script src="js/toast.js"></script>
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>

    <!-- Invoice JS -->
    <script src="js/invoice.js"></script>

    <script src="js/pwa.js"></script>
    <script src="js/theme.js"></script>


</html>
